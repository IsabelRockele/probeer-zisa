    const others=Object.entries(tools).filter(([s,o])=>s!==slug&&o.c===x.c).slice(0,5);
    app.innerHTML=`

      <section class="result"><div><h2>Dit levert de tool op</h2><p>${x.r}</p></div><span class="type">✓ ${x.t}</span></section>

      <p class="notice">Dit is een informatieve voorbeeldpagina. De volledige generator of interactieve tool is beschikbaar na het inloggen bij Spelgenerator PRO.</p>`;
