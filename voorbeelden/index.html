    'punttekening':{n:'Punttekening',c:'Creatief en bouwen',i:'punttekening.png',d:'Maak een verbind-de-puntenopdracht met een herkenbare figuur.',k:['Kies een figuur','Bepaal het aantal en de nummering van de punten','Pas de moeilijkheid aan'],r:'Een printbare punttekening die na het verbinden zichtbaar wordt.',t:'PDF-opdracht'},
    'pixelart':{n:'Pixelart',c:'Creatief en bouwen',i:'pixelart.png',d:'Laat een afbeelding ontstaan door vakjes volgens een code in te kleuren.',k:['Kies of ontwerp de afbeelding','Bepaal rooster en kleurcode','Pas complexiteit en formaat aan'],r:'Een printbare pixelartopdracht met kleurcode.',t:'PDF-opdracht'},
    'bouwplaten':{n:'Bouwplaten',c:'Creatief en bouwen',i:'bouwplaat.png',vs:['voorbeeld-bouwplaten-1.png','voorbeeld-bouwplaten-2.png'],d:'Ontwerp gekleurde bouwpatronen die kinderen echt kunnen nabouwen met Linking Cubes of Clics.',k:['Maak een figuur met gekleurde bouwblokjes','Pas het patroon en de gebruikte kleuren aan','Druk het voorbeeld af als bouwopdracht voor de leerlingen'],r:'Een printbaar bouwpatroon dat kinderen met echt constructiemateriaal kunnen namaken.',t:'Printbare bouwopdracht'},
    'coderen':{n:'Coderen',c:'Creatief en bouwen',i:'coderen.png',v:'voorbeeld-coderen.png',d:'Laat leerlingen een figuur maken door een reeks codes te volgen.',k:['Kies het rooster en de figuur','Bepaal de soort code of instructies','Pas de moeilijkheid aan'],r:'Een printbare codeeropdracht zonder dat leerlingen moeten programmeren.',t:'PDF-opdracht'},
    'blokkenbouwsels':{n:'Blokkenbouwsels',c:'Creatief en bouwen',i:'blokkenbouwsels.png',vs:['voorbeeld-blokkenbouwsels-1.png','voorbeeld-blokkenbouwsels-2.png','voorbeeld-blokkenbouwsels-3.png'],d:'Ontwerp en bekijk constructies met blokken vanuit verschillende richtingen.',k:['Bouw zelf een constructie','Bekijk verschillende aanzichten','Maak een opdracht rond tellen en ruimtelijk inzicht'],r:'Een visuele opdracht of printbaar blad rond blokkenbouwsels.',t:'PDF en ontwerp'},
    'plattegrond':{n:'Plattegrond',c:'Creatief en bouwen',i:'plattegrond.png',d:'Oefen plaats, richting en ruimtelijke begrippen met een plattegrond.',k:['Maak of kies de indeling','Plaats voorwerpen en herkenningspunten','Formuleer passende kijk- en routeopdrachten'],r:'Een printbare plattegrond voor ruimtelijke opdrachten.',t:'PDF-opdracht'},
    'bingo':{n:'Bingo',c:'Spelvormen',i:'bingo.png',d:'Speel bingo interactief met je klas op het digibord.',k:['Vul getallen, woorden of eigen inhoud in','Stel je spel samen voor de gekozen lesinhoud','Gebruik de bingo meteen klassikaal zonder iets af te drukken'],r:'Een interactief bingospel voor gebruik aan het bord — zonder PDF.',t:'Digibordspel'},
    'vier-op-een-rij':{n:'Vier op een rij',c:'Spelvormen',i:'vieropeenrij.png',d:'Verwerk oefeningen in een spelbord voor twee leerlingen.',k:['Kies of vul de oefeninhoud in','Bepaal de opbouw van het bord','Maak verschillende spelvarianten'],r:'Een printbaar oefenspel voor duo’s.',t:'PDF-spel'},
    'rad':{n:'Rad',c:'Spelvormen',i:'rad.png',d:'Laat een digitaal rad willekeurig een naam, opdracht of keuze aanduiden.',k:['Vul zelf namen, woorden of opdrachten in','Pas kleuren en keuzes aan','Gebruik het rad meteen op het digibord zonder iets af te drukken'],r:'Een interactief rad voor klassikaal gebruik op het bord — zonder PDF.',t:'Digibordtool'},
    'qr-generator':{n:'QR-generator',c:'Spelvormen',i:'QR.png',d:'Zet een websiteadres onmiddellijk om in een scanbare QR-code.',k:['Plak het webadres dat je wilt delen','Laat Zisa er meteen een QR-code van maken','Download of toon de code zodat leerlingen de website kunnen openen'],r:'Een QR-code van jouw website, klaar om te downloaden, tonen of delen.',t:'Digitale tool'},
    'bundel-kloklezen':{n:'Bundel kloklezen',c:'Tijd en klok',i:'werkblad_kloklezen.png',vs:['voorbeeld-bundel-kloklezen-1.png','voorbeeld-bundel-kloklezen-2.png','voorbeeld-bundel-kloklezen-3.png','voorbeeld-bundel-kloklezen-4.png'],d:'Maak een bundel met analoge en digitale klokoefeningen.',k:['Kies tijdstappen en kloktypes','Selecteer lezen, tekenen of omzetten','Combineer verschillende oefenvormen'],r:'Een printklare bundel met gevarieerde klokoefeningen.',t:'PDF-bundel'},
    'bundel-kalenders':{n:'Bundel kalenders',c:'Tijd en klok',i:'kalender.png',vs:['voorbeeld-bundel-kalenders-1.png','voorbeeld-bundel-kalenders-2.png'],d:'Oefen dagen, maanden, data en informatie aflezen op kalenders.',k:['Kies het soort kalenderoefening','Bepaal de periode en moeilijkheid','Combineer verschillende vragen'],r:'Een printklare bundel rond kalendergebruik en tijd.',t:'PDF-bundel'},

    'opvolging-huistaken':{n:'Opvolging huistaken',c:'Klasmanagement',i:'huistaken.png',d:'Zie snel welke huistaken leerlingen hebben afgewerkt en probeer de werking in een demoklas.',k:['Maak je klas en leerlingen aan','Registreer en volg huistaken overzichtelijk','Gebruik de leerlingweergave via een persoonlijke toegang'],r:'Een digitaal overzicht voor de leerkracht en een eenvoudige leerlingweergave — geen PDF. Er is een demo beschikbaar.',t:'Interactieve tool',demo:'../demo/huistaken/'},
    'takenbord':{n:'Takenbord',c:'Klasmanagement',i:'takenbord.png',d:'Verdeel klastaken en toon ieder kind duidelijk wat het moet doen.',k:['Maak je klas en taken aan','Verdeel taken over leerlingen','Toon het klasoverzicht of de persoonlijke kaart'],r:'Een visueel takenbord voor leerkracht en leerlingen.',t:'Interactieve tool',demo:'../demo/takenbord/'},
    'planbord':{n:'Planbord',c:'Klasmanagement',i:'planbord.png',v:'voorbeeld-planbord.png',vc:'Echte schermweergave van een planbord. De leerkracht stelt dit samen en toont het bij het begin van de dag; dit is geen PDF.',d:'Maak een visueel bord voor het begin van de klasdag, zodat kinderen meteen weten wat er van hen verwacht wordt.',k:['Noteer wat leerlingen bij het binnenkomen moeten doen','Voeg herkenbare afbeeldingen, het weer en een seizoensbeeld toe','Toon de werktijd met een timer en kies de gewenste werkstijl','Pas de begroeting en inhoud aan je eigen klas aan'],r:'Een interactief dagscherm voor het digibord dat rust, duidelijkheid en structuur geeft — geen PDF.',t:'Digibordtool'}
  };
  function voorbeeldMarkup(s,x){
    if(x.video) return `<video class="real-video" controls muted playsinline preload="metadata" aria-label="Demonstratiefilmpje van ${x.n}"><source src="${x.video}" type="video/mp4">Je browser kan dit filmpje niet afspelen.</video><p class="preview-caption">Bekijk zonder geluid hoe leerlingen MAB en schema op de iPad als rekenhulp gebruiken.</p>`;
    if(x.vs) return `<div class="preview-gallery count-${x.vs.length}${s==='bundel-geld'?' crop-first-left':''}">${x.vs.map((v,i)=>`<a href="assets/${v}" target="_blank" rel="noopener" aria-label="Open voorbeeldpagina ${i+1} van ${x.n} groot"><img class="real-preview" src="assets/${v}" alt="Werkelijk gegenereerde voorbeeldpagina ${i+1} uit ${x.n}"></a>`).join('')}</div><p class="preview-caption">${x.vs.length} echte pagina's uit de generator. Klik op een pagina om ze groot te bekijken.</p>`;
    if(x.v) return `<img class="real-preview" src="assets/${x.v}" alt="Werkelijk gegenereerd voorbeeld uit ${x.n}"><p class="preview-caption">${x.vc||'Werkelijk voorbeeld uit de generator. De inhoud verandert volgens je eigen instellingen.'}</p>`;
    const header=`<div class="sample-top"><strong>${x.n}</strong><span class="sample-name">Naam: __________________</span></div>`;
    if(x.t.includes('Digibord')||x.t.includes('Interactieve')||x.t==='Digitale tool'||x.t==='Klasspel'){
      const labels=x.c==='Klasmanagement'?['Vandaag','Zelfstandig werk','Afgerond']:x.n==='Timer'?['10:00','Start','Pauze']:x.n==='Rad'?['Lezen','Rekenen','Spelling']:['Keuze 1','Keuze 2','Keuze 3'];
      return `<div class="sample-paper">${header}<div class="sample-instruction">Voorbeeld op het scherm</div><div class="dashboard">${labels.map(v=>`<div class="dash-card">${v}</div>`).join('')}</div><p style="text-align:center;margin-top:36px;color:#65727c">Deze tool gebruik je rechtstreeks in je browser of op het digibord.</p></div><p class="preview-caption">Vereenvoudigde schermweergave; kleuren en inhoud pas je in de tool aan.</p>`;
    }
    if(x.c==='Taal en letters'){
      if(['woordzoeker','kruiswoordpuzzel','lettercode','lettertetris','geheime-boodschap'].includes(s)){
        const letters='ZISASPELM A K E N L E U K'.replace(/ /g,'').split('').slice(0,20);
        return `<div class="sample-paper">${header}<div class="sample-instruction">Zoek of ontcijfer de woorden.</div><div class="word-grid">${letters.map(v=>`<span>${v}</span>`).join('')}</div></div><p class="preview-caption">Voorbeeldweergave met eigen woorden; het echte blad wordt door de tool opgebouwd.</p>`;
      }
      return `<div class="sample-paper">${header}<div class="sample-instruction">Lees of schrijf de woorden.</div><div class="exercise-grid">${['maan','roos','vis','boek','school','zebra'].map(v=>`<div class="exercise">${v}</div>`).join('')}</div><div style="margin-top:30px;display:grid;gap:18px"><span style="border-bottom:1px solid #9eabb4"></span><span style="border-bottom:1px solid #9eabb4"></span><span style="border-bottom:1px solid #9eabb4"></span></div></div><p class="preview-caption">Voorbeeldweergave; woorden, niveau en opdracht hangen af van je keuzes.</p>`;
    }
    if(x.c==='Puzzels en logica'||x.c==='Creatief en bouwen'){
      const vals=['1','2','3','4','★','●','▲','■','5','6','7','8','◆','○','△','□'];
      return `<div class="sample-paper">${header}<div class="sample-instruction">Kijk, puzzel of bouw de opdracht verder af.</div><div class="game-grid">${vals.map(v=>`<span>${v}</span>`).join('')}</div></div><p class="preview-caption">Voorbeeldweergave; de gekozen figuur en moeilijkheid bepalen het uiteindelijke blad.</p>`;
    }
    if(x.c==='Spelvormen'){
      return `<div class="sample-paper">${header}<div class="sample-instruction">Speel met de inhoud uit jouw les.</div><div class="game-grid">${Array.from({length:16},(_,i)=>`<span>${i+1}</span>`).join('')}</div></div><p class="preview-caption">Voorbeeld van een spelblad; elke leerling kan een andere kaart krijgen.</p>`;
    }
    if(x.c==='Tijd en klok'){
      return `<div class="sample-paper">${header}<div class="sample-instruction">Schrijf de tijd of teken de wijzers.</div><div class="exercise-grid">${['🕘  ______','🕥  ______','14:15  ◯','08:30  ◯','🕛  ______','16:45  ◯'].map(v=>`<div class="exercise">${v}</div>`).join('')}</div></div><p class="preview-caption">Voorbeeldweergave; tijdstappen en kloktypes stel je zelf in.</p>`;
    }
    const sums=s.includes('meetkunde')?['△ 3 zijden','□ 4 zijden','○ rond','▭ rechthoek','◇ ruit','⬡ 6 zijden']:s.includes('geld')?['€ 2 + € 1 =','€ 5 − € 2 =','50 ct + 20 ct =','Leg € 4,50','Wissel € 10','Hoeveel terug?']:['8 + 7 =','16 − 9 =','6 × 4 =','24 : 6 =','35 + 18 =','72 − 26 =','9 × 7 =','48 : 8 =','100 − 37 ='];
    return `<div class="sample-paper">${header}<div class="sample-instruction">${x.d}</div><div class="exercise-grid">${sums.map(v=>`<div class="exercise">${v} ______</div>`).join('')}</div></div><p class="preview-caption">Voorbeeldweergave; de echte oefeningen worden volgens je instellingen gegenereerd.</p>`;
  }
  const slug=new URLSearchParams(location.search).get('tool');
  const x=tools[slug];
  const app=document.getElementById('app');
  if(!x){
    app.innerHTML='<div class="error"><span class="tag">Voorbeeld niet gevonden</span><h1>Kies een tool uit het overzicht.</h1><p class="lead">Deze voorbeeldlink bestaat niet of is onvolledig.</p><div class="actions" style="justify-content:center"><a class="btn primary" href="../index.html#zg-tools">Terug naar alle tools</a></div></div>';
  }else{
    document.title=x.n+' — voorbeeld | Spelgenerator PRO';
    const others=Object.entries(tools).filter(([s,o])=>s!==slug&&o.c===x.c).slice(0,5);
    app.innerHTML=`
      <div class="crumb"><a href="../index.html">Spelgenerator PRO</a> · <a href="../index.html#zg-tools">${x.c}</a> · ${x.n}</div>
      <section class="hero">
        <div><span class="tag">${x.t==='Binnenkort'?'In ontwikkeling':'Voorbeeld'} · ${x.c}</span><h1>${x.n}</h1><p class="lead">${x.d}</p>${x.t==='Binnenkort'?'<p style="font-weight:800;color:#9a5b00">Nog niet beschikbaar in PRO. Je krijgt hier al een eerste vooruitblik.</p>':''}<div class="actions">${x.demo?`<a class="btn primary" href="${x.demo}">Probeer de demo ↗</a>`:''}<a class="btn ${x.demo?'secondary':'primary'}" href="https://tools.jufzisa.be/pro/koop.html" target="_blank" rel="noopener">${x.t==='Binnenkort'?'Ontdek de huidige PRO-tools ↗':'Zelf gebruiken met PRO ↗'}</a></div></div>
        <div class="visual"><img src="assets/${x.i}" alt="Voorbeeldillustratie van ${x.n}"></div>
      </section>
      ${(x.v||x.vs||x.video)?`<section class="preview-section"><div class="preview-head"><h2>${x.video?'Bekijk hoe deze tool werkt':'Echte voorbeelden uit deze tool'}</h2><p>${x.video?'Een korte demonstratie uit de klaspraktijk.':'Deze resultaten werden werkelijk met '+x.n+' gemaakt.'}</p></div><div class="paper-wrap">${voorbeeldMarkup(slug,x)}</div></section>`:''}
      <section class="grid"><article class="card"><h2>Wat kun je instellen?</h2><ul class="checks">${x.k.map(v=>`<li>${v}</li>`).join('')}</ul></article><article class="card"><h2>Waarom handig?</h2><p>Je vertrekt niet van een vast kant-en-klaar blad. Je kiest zelf wat past bij jouw les, waarna Zisa het materiaal of de weergave voor je opbouwt.</p><p><strong>Een andere versie nodig?</strong> Pas je keuzes aan en maak opnieuw.</p></article></section>
      <section class="result"><div><h2>Dit levert de tool op</h2><p>${x.r}</p></div><span class="type">✓ ${x.t}</span></section>
      ${others.length?`<section class="more"><h2>Bekijk ook binnen ${x.c.toLowerCase()}</h2><div class="morelinks">${others.map(([s,o])=>`<a href="?tool=${s}">${o.n}</a>`).join('')}</div></section>`:''}
      <p class="notice">Dit is een informatieve voorbeeldpagina. De volledige generator of interactieve tool is beschikbaar na het inloggen bij Spelgenerator PRO.</p>`;
  }
  </script>
